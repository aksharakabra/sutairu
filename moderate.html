<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review room | Sutairu</title>
<meta name="description" content="Review room.">
<meta name="theme-color" content="#F3EBDD">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:ital,wght@0,500;1,500&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sutairu.css">
</head>
<body>
<div class="wrap">
  <nav class="nav" aria-label="Main">
    <a class="logo" href="index.html">Sutairu</a>
    <div class="links"><a href="shop.html">Shop floor</a><a href="community.html">Community</a><a href="fitting-room.html">Fitting room</a><a href="wardrobe.html">Wardrobe</a></div>
    <button class="icon-btn" id="theme" aria-label="Switch between day and evening shop">☾</button>
  </nav>
  <main class="section" style="padding-top:20px;display:grid;gap:20px;justify-items:start">
    <h1>Review room</h1>
    <div class="stitch" id="guest" hidden style="max-width:420px"><h3>Staff only</h3><p>Please log in to continue.</p><p style="margin-top:14px"><a class="btn" href="join.html">Log in</a></p></div>
    <div class="stitch" id="no" hidden style="max-width:420px"><h3>Staff only</h3><p>This room is for the people who look after the shop.</p></div>
    <div id="room" hidden style="width:100%;max-width:700px;display:none;gap:26px">
      <section><h2>Open reports</h2><div id="reps"></div></section>
    </div>
  </main>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="store.js"></script>
<script src="catalog.js"></script>
<script>
var $ = function (s) { return document.querySelector(s); }, esc = Store.esc, byCat = {};
CATALOG.forEach(function (c) { byCat[c.id] = c; });
var RS = { inappropriate: 'Not safe or appropriate', copyright: 'Photo isn’t theirs, or no permission', harassment: 'Harassment or hate', spam: 'Spam or advertising', not_fashion: 'Not about fashion', other: 'Something else' };
async function draw() {
  var reps = await Store.reports(), g = {};
  reps.forEach(function (r) { (g[r.look_ref] = g[r.look_ref] || []).push(r); });
  var refs = Object.keys(g), ids = refs.filter(function (r) { return r.indexOf('com:') === 0; }).map(function (r) { return r.slice(4); });
  var looks = {}; (ids.length ? await Store.looksByIds(ids) : []).forEach(function (l) { looks[l.id] = l; });
  $('#reps').innerHTML = refs.length ? refs.map(function (ref) {
    var isCom = ref.indexOf('com:') === 0, l = isCom ? looks[ref.slice(4)] : byCat[ref.slice(4)];
    var img = l ? (isCom ? l.url : 'images/' + l.thumb) : '', title = l ? l.title : '(this look no longer exists)';
    return '<div class="mine-row">' + (img ? '<img src="' + esc(img) + '" alt="" style="width:80px;aspect-ratio:3/4;object-fit:cover;border-radius:6px">' : '') +
      '<div style="flex:1;display:grid;gap:6px"><h3>' + esc(title) + '</h3><p class="hand">' + (isCom ? 'Community look' : 'Shop catalog look') + ', ' + g[ref].length + (g[ref].length === 1 ? ' report' : ' reports') + '</p>' +
      '<ul style="margin:0;padding-left:18px">' + g[ref].map(function (r) { return '<li>' + esc(RS[r.reason] || r.reason) + (r.note ? ': ' + esc(r.note) : '') + '</li>'; }).join('') + '</ul>' +
      '<div class="row"><button class="btn btn--ghost" data-dis="' + esc(ref) + '">Dismiss reports</button>' +
      (isCom && l ? '<button class="btn" data-rem="' + esc(ref) + '">Remove this look</button>' : '') + '</div>' +
      (!isCom ? '<p class="fine">This is one of your own shop photos. To remove it, delete it from catalog.json and catalog.js.</p>' : '') + '</div></div>';
  }).join('') : '<p>No open reports.</p>';
}
Store.user().then(async function (u) {
  if (!u) { $('#guest').hidden = false; return; }
  if (!(await Store.isModerator())) { $('#no').hidden = false; return; }
  $('#room').hidden = false; $('#room').style.display = 'grid'; return draw();
}).catch(function (e) { console.error(e); });
document.addEventListener('click', async function (e) {
  var b = e.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.dis) await Store.resolveReports(b.dataset.dis);
    else if (b.dataset.rem) { await Store.reviewLook(b.dataset.rem.slice(4), 'rejected', 'Removed after a report'); await Store.resolveReports(b.dataset.rem); }
    else return;
    await draw();
  } catch (err) { alert('Tangled thread. Try again?'); }
});
</script>
</body>
</html>
